<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EmotioGantt — sign in</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="brand big">Emotio<span>Gantt</span></div>
    <p class="muted">Sign in to your projects.</p>
    <form id="loginForm">
      <input type="text" id="username" placeholder="Username" autofocus autocomplete="username">
      <input type="password" id="password" placeholder="Password" autocomplete="current-password">
      <button type="submit" class="btn primary">Sign in</button>
      <p id="loginErr" class="err hidden">That didn't match — try again.</p>
    </form>
  </div>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  // continuity: password typed alone still works as the old shared passcode
  const body = username ? { username, password } : { passcode: password };
  const r = await fetch('/login', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  if (r.ok) location.href = '/';
  else document.getElementById('loginErr').classList.remove('hidden');
});
</script>
</body>
</html>
