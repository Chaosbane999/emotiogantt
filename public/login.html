<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClearPath — sign in</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="brand big">Clear<span>Path</span></div>
    <p class="muted">Enter your passcode to continue.</p>
    <form id="loginForm">
      <input type="password" id="passcode" placeholder="Passcode" autofocus autocomplete="current-password">
      <button type="submit" class="btn primary">Enter</button>
      <p id="loginErr" class="err hidden">That passcode didn't match — try again.</p>
    </form>
  </div>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const r = await fetch('/login', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ passcode: document.getElementById('passcode').value }),
  });
  if (r.ok) location.href = '/';
  else document.getElementById('loginErr').classList.remove('hidden');
});
</script>
</body>
</html>
