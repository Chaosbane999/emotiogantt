services:
  emotiogantt:
    build: https://github.com/Chaosbane999/emotiogantt.git
    volumes:
      - emotiogantt-data:/data
    environment:
      # set the real passcode in the Hostinger Docker Manager yaml, not here
      - APP_PASSCODE=${APP_PASSCODE:-}
    labels:
      - traefik.enable=true
      - "traefik.http.routers.emotiogantt.rule=Host(`gantt.emotioflow.com`)"
      - traefik.http.routers.emotiogantt.entrypoints=websecure
      - traefik.http.routers.emotiogantt.tls.certresolver=letsencrypt
      - traefik.http.services.emotiogantt.loadbalancer.server.port=3000
    restart: unless-stopped
volumes:
  emotiogantt-data:
